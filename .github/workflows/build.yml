name: Build A21s Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3
      with:
        submodules: 'true'
        fetch-depth: 1

    - name: Setup Environment and ccache
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache git make gcc bc bison flex libssl-dev zip

    - name: Setup Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain

    - name: Compile Kernel
      run: |
        export PATH="$(pwd)/toolchain/bin:$PATH"
        export ARCH=arm64
        export CC="ccache clang"
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        make O=out exynos850-a217f_defconfig
        make -j$(nproc) O=out

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v3
      with:
        name: Image
        path: out/arch/arm64/boot/Image
        
